name: CI

# テストするのは「作業ブランチ → develop の PR」と「develop への取り込み（直接 push を含む）」だけ。
# develop → main の昇格 PR と main への取り込みでは回さない。中身は develop で試験済みのものと同じで、
# 同じテストを 3〜4 回流して待ち時間だけが増えていた（2026-09-10 は 1 日 29 回のうち 10 回が重複）。
# main / develop とも「チェック必須」の保護は掛けていないので、ここで外しても取り込みは止まらない。
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# 同じ PR に続けて push したら、古いほうのテストは止める。
# develop への push はコミットごとに別のグループ（sha）にして、止めも待たせもしない。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:run
      # packages/* はルートの vitest / tsc の対象外(src/** のみ)なので、ここで別に回す。
      # 回さないと packages 側の認可条件を壊しても CI が緑のまま通ってしまう。
      - name: Install package dependencies (agentpm-core / cli)
        run: |
          npm ci --prefix packages/mcp-server
          npm ci --prefix packages/cli
      - name: Typecheck packages
        run: |
          npx tsc --noEmit -p packages/mcp-server/tsconfig.json
          npx tsc --noEmit -p packages/cli/tsconfig.json
      - name: Unit tests (packages)
        run: |
          npx vitest run --root packages/mcp-server
          npx vitest run --root packages/cli
